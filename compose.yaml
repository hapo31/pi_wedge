services:
  seaweedfs:
    image: ${SEAWEED_IMAGE:-chrislusf/seaweedfs:4.48}
    command: ['mini', '-dir=/data', '-ip=seaweedfs', '-ip.bind=0.0.0.0']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-pi-wedge}
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - ${SEAWEED_DATA_DIR:-/var/lib/pi_wedge}:/data
    restart: unless-stopped
    stop_grace_period: 30s
